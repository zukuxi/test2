<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<title>X3 文档 PDF 转换器</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--panel:#191f2b;--line:#30394a;--text:#edf2fa;--muted:#a8b3c5;--accent:#8bd5ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:auto;padding:22px 14px 44px}h1{font-size:clamp(23px,5vw,32px);margin:0 0 8px}.lead,.hint{color:var(--muted)}.lead{margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:13px 0}
button{background:var(--accent);color:#10201f;border:0;border-radius:10px;padding:12px 15px;font-weight:750;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#2a3445;color:var(--text)}
input[type=file]{display:none}.row{display:flex;gap:12px;flex-wrap:wrap}.field{flex:1;min-width:150px}label{display:block;font-weight:650;margin-bottom:6px}
select,input[type=number]{width:100%;padding:11px;border-radius:9px;border:1px solid var(--line);background:#0f141d;color:var(--text);font:inherit}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.progress{height:8px;background:#0d1118;border-radius:9px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:var(--accent);transition:width .12s}
.status{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.hint{font-size:13px}.preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.preview-card{min-width:0;text-align:center;color:var(--muted);font-size:13px}.preview-card img{width:100%;height:auto;max-height:320px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:6px}
.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:18px;height:18px}
@media(max-width:520px){.preview-grid{gap:4px}.preview-card img{max-height:230px}.panel{padding:13px}}
</style>
</head>
<body><main class="wrap">
<h1>X3 文档 PDF 转换器</h1>
<p class="lead">将普通文档 PDF、扫描 PDF、图片型 PDF 统一转换为 XTC / XTCH。每页自动去白边、转为横向，再按左、中、右切成三页，适合 Xteink X3 横向手持阅读。</p>
<section class="panel">
  <div class="actions"><button id="pick">选择一个或多个 PDF</button><input id="pdfs" type="file" accept="application/pdf,.pdf" multiple></div>
  <div id="fileInfo" class="hint" style="margin-top:10px">尚未选择 PDF。</div>
</section>
<section class="panel">
  <h3 style="margin:0 0 12px">转换设置</h3>
  <div class="row">
    <div class="field"><label for="depth">输出格式</label><select id="depth"><option value="1">XTC · 黑白</option><option value="2" selected>XTCH · 4 灰阶</option></select></div>
    <div class="field"><label for="trim">白边裁切</label><select id="trim"><option value="normal" selected>普通（谨慎裁切）</option><option value="strong">积极（尽量去除白边）</option><option value="off">关闭</option></select></div>
    <div class="field"><label for="scale">PDF 渲染清晰度</label><select id="scale"><option value="1.5">标准 · 1.5×</option><option value="2" selected>清晰 · 2×</option><option value="2.5">高清 · 2.5×</option></select></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="field"><label for="dither">抖动算法</label><select id="dither"><option value="floyd">Floyd–Steinberg</option><option value="atkinson" selected>Atkinson</option><option value="sierra-lite">Sierra Lite</option><option value="ordered">Ordered / Bayer</option><option value="none">无抖动</option></select></div>
    <div class="field"><label for="contrast">对比度</label><select id="contrast"><option value="none">无</option><option value="light">轻微</option><option value="medium" selected>中等</option><option value="strong">强</option><option value="maximum">最大</option></select></div>
    <div class="field"><label for="brightness">亮度</label><select id="brightness"><option value="-30">较暗 -30</option><option value="-15">稍暗 -15</option><option value="0" selected>默认 0</option><option value="15">稍亮 +15</option><option value="30">较亮 +30</option></select></div>
  </div>
  <p class="hint">每页固定切成三等分，顺序为左 → 中 → 右。切割前会先裁切白边；切割后的内容保持比例，不强行拉伸。</p>
  <div class="actions"><button id="previewBtn" class="secondary" disabled>预览第一页</button><button id="start" disabled>开始转换</button><button id="cancel" class="secondary" disabled>取消</button></div>
</section>
<section class="panel">
  <h3 style="margin:0">第一页切割预览</h3><p id="previewInfo" class="hint">选择 PDF 后可预览第一张 PDF 页面的三个切割区域。</p>
  <div id="previewGrid" class="preview-grid"></div>
</section>
<section class="panel">
  <div id="progressText" class="status">等待转换。</div><div class="progress"><div id="bar" class="bar"></div></div>
  <p class="hint">所有处理均在浏览器本地完成，PDF 不会上传。转换时逐页渲染和释放临时画布；输出页面会暂存为 XTC 编码数据，最后组装成文件。</p>
</section>
</main><script type="module" src="./app.js"></script></body></html>
